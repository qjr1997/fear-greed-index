name: Update Fear & Greed Index Data

on:
  schedule:
    - cron: '30 7 * * *'  # UTC 07:30 = 北京时间 15:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install "akshare==1.18.78" pandas numpy
        python -c "import akshare; print('akshare', akshare.__version__)"
        
    - name: Update data
      run: |
        python << 'PYEOF'
        import json
        import os
        import sys
        sys.path.insert(0, os.getcwd())  # 保证能 import 仓库根目录的 comment_engine.py
        import warnings
        warnings.filterwarnings('ignore')
        
        import akshare as ak
        import pandas as pd
        import numpy as np
        from datetime import datetime, timedelta
        import time as _time

        def _dedup(s):
            """按日期去重（akshare 数据源偶尔返回同一天两行，例如 QVIX 的 2026-11-02），保留最后一行。
            不去重会让 pd.concat 报 ValueError: cannot reindex on an axis with duplicate labels（2026-11-04 起每日失败的原因）。"""
            dup = int(s.index.duplicated().sum())
            if dup:
                print(f"  [warn] {s.name}: 去掉 {dup} 个重复日期")
            return s[~s.index.duplicated(keep='last')].sort_index()
        
        print("Getting market data...")
        
        # 数据范围：2017-01-01 起（全历史，用于 data_full.json）；页面首屏只用近 252 天
        end_date = datetime.now()
        start_date = datetime(2017, 1, 1)
        start_str = start_date.strftime('%Y%m%d')
        end_str = end_date.strftime('%Y%m%d')
        
        # 获取基础数据
        print("Fetching HS300...")
        hs300 = ak.stock_zh_a_hist_tx(symbol='sh000300', start_date=start_str, end_date=end_str)
        hs300['date'] = pd.to_datetime(hs300['date'])
        hs300 = _dedup(hs300.set_index('date')['close'].rename('hs300'))
        
        print("Fetching Bond Index...")
        bond = ak.stock_zh_a_hist_tx(symbol='sh000012', start_date=start_str, end_date=end_str)
        bond['date'] = pd.to_datetime(bond['date'])
        bond = _dedup(bond.set_index('date')['close'].rename('bond_index'))
        
        print("Fetching Turnover...")
        sh = ak.stock_zh_a_hist_tx(symbol='sh000001', start_date=start_str, end_date=end_str)
        sz = ak.stock_zh_a_hist_tx(symbol='sz399001', start_date=start_str, end_date=end_str)
        sh['date'] = pd.to_datetime(sh['date'])
        sz['date'] = pd.to_datetime(sz['date'])
        turnover_sh = _dedup(sh.set_index('date')['amount'].rename('turnover_sh'))
        turnover_sz = _dedup(sz.set_index('date')['amount'].rename('turnover_sz'))
        # 首页主图要画「上证指数 vs 恐贪指数」对比线，前端强制读 chart.sh_index
        # （2026-04 建站后的某次脚本改动把它弄丢了，页面一直报 data.sh_index is not iterable）
        sh_index = _dedup(sh.set_index('date')['close'].rename('sh_index'))
        
        print("Fetching VIX...")
        try:
            vix_df = ak.index_option_50etf_qvix()
            vix_df['date'] = pd.to_datetime(vix_df['date'])
            vix = _dedup(vix_df.set_index('date')['close'].rename('vix'))
        except:
            # 如果VIX获取失败，用波动率代替
            returns = hs300.pct_change()
            vix = returns.rolling(20).std() * np.sqrt(252) * 100
            vix = vix.rename('vix')
        
        print("Fetching Futures...")
        try:
            futures = ak.futures_main_sina(symbol='IF0')
            futures['日期'] = pd.to_datetime(futures['日期'])
            futures = _dedup(futures.set_index('日期')['收盘价'].rename('if_close'))
        except:
            futures = None
        
        # 合并数据
        print("Merging data...")
        raw = pd.concat([vix, turnover_sh, turnover_sz, hs300, sh_index, bond], axis=1)
        if futures is not None:
            raw = raw.join(futures, how='outer')
        raw = raw.sort_index()
        # 各数据源交易日历不完全一致，outer 合并后会有零散 NaN；
        # 不填的话 rolling(50) 的窗口里只要有一个 NaN 整段就变 NaN ——
        # 2026-08-22 起「股价强度」就这么静默失效了（Z-Score 一直是 nan，FGI 实际只用了 4 个指标）。
        raw = raw.ffill()
        
        # 计算子指标
        print("Calculating indicators...")
        indicators = pd.DataFrame(index=raw.index)
        
        # 1. 波动率 (VIX)
        indicators['volatility'] = raw['vix']
        
        # 2. 成交量偏离度
        total_turnover = raw['turnover_sh'] + raw['turnover_sz']
        ma20 = total_turnover.rolling(window=20, min_periods=10).mean()
        indicators['volume'] = (total_turnover / ma20 - 1) * 100
        
        # 3. 期货升贴水率
        if 'if_close' in raw.columns:
            aligned = pd.concat([raw['if_close'], raw['hs300']], axis=1).dropna()
            basis = (aligned['if_close'] - aligned['hs300']) / aligned['hs300'] * 100
            annualized = basis * (252 / 30)
            indicators['futures_premium'] = annualized.rolling(window=10, min_periods=5).mean()
        else:
            indicators['futures_premium'] = pd.Series(dtype=float)
        
        # 4. 避险需求 (股债回报差)
        stock_ret = raw['hs300'].pct_change(20) * 100
        bond_ret = raw['bond_index'].pct_change(20) * 100
        indicators['safe_haven'] = stock_ret - bond_ret
        
        # 5. 股价强度 (用价格偏离度代替，因为无法获取全市场股票)
        price_ma50 = raw['hs300'].rolling(50).mean()
        indicators['stock_strength'] = (raw['hs300'] - price_ma50) / price_ma50 * 100
        
        # Z-Score 计算函数
        def calc_zscore(series, k=33.3, window=252, reverse=False):
            result = pd.Series(index=series.index, dtype=float)
            for i in range(len(series)):
                if i < window - 1:
                    continue
                window_data = series.iloc[i-window+1:i+1].dropna()
                if len(window_data) < window // 2:
                    continue
                val = series.iloc[i]
                mean = window_data.mean()
                std = window_data.std()
                if std == 0 or np.isnan(std):
                    result.iloc[i] = 50
                    continue
                z = (val - mean) / std
                score = 50 + z * k
                if reverse:
                    score = 100 - score
                # 子指标Z-Score不截断
                result.iloc[i] = score
            return result
        
        # 计算各子指标Z-Score
        print("Calculating Z-Scores...")
        zscores = pd.DataFrame(index=indicators.index)
        
        zscores['volatility_zscore'] = calc_zscore(indicators['volatility'], k=33.3, window=252, reverse=True)
        zscores['volume_zscore'] = calc_zscore(indicators['volume'], k=33.3, window=252, reverse=False)
        zscores['futures_premium_zscore'] = calc_zscore(indicators['futures_premium'], k=33.3, window=252, reverse=False)
        zscores['safe_haven_zscore'] = calc_zscore(indicators['safe_haven'], k=33.3, window=252, reverse=False)
        zscores['stock_strength_zscore'] = calc_zscore(indicators['stock_strength'], k=33.3, window=252, reverse=False)
        
        # 等权平均得到FGI
        fgi_raw = zscores.mean(axis=1)
        
        # 关键修复：FGI限制在0-100范围内
        fgi = fgi_raw.clip(0, 100)
        
        # 导数
        derivative = fgi.diff()
        
        # 准备输出
        print("Preparing output...")
        latest_idx = fgi.dropna().index[-1]
        latest_fgi = fgi.dropna().iloc[-1]
        latest_der = derivative.dropna().iloc[-1] if not derivative.dropna().empty else 0
        
        # 获取最新的子指标Z-Score
        latest_zscores = zscores.loc[latest_idx] if latest_idx in zscores.index else zscores.iloc[-1]
        
        chart_data = fgi.dropna().tail(252)

        # 序列 -> 严格 JSON 数值数组：先按 dates 对齐、缺失前向填充，仍缺则给默认值。
        # 关键：python 的 json.dump 会把 NaN 写成裸 NaN（不是合法 JSON），
        # 浏览器 JSON.parse 直接报 "Unexpected token 'N'"，整页数据加载失败（2026-11-12 踩过）。
        def _arr(series, idx, nd, default=0.0):
            s = series.reindex(idx).ffill()
            return [round(float(x), nd) if not np.isnan(x) else default for x in s.tolist()]

        def _arr_z(series, idx):
            return _arr(series, idx, 1, default=50.0)
        
        # 一句话解读（comment_engine.py：只描述状态，不预测、不给建议）
        try:
            from comment_engine import build_comment
            _comment = build_comment(
                {
                    "vol": float(latest_zscores['volatility_zscore']),
                    "volume": float(latest_zscores['volume_zscore']),
                    "futures": float(latest_zscores['futures_premium_zscore']),
                    "safe_haven": float(latest_zscores['safe_haven_zscore']),
                    "strength": float(latest_zscores['stock_strength_zscore']),
                },
                float(latest_fgi), float(latest_der),
            )
        except Exception as e:
            print(f"[warn] 一句话解读生成失败（不影响数据）：{type(e).__name__}: {e}")
            _comment = {"headline": "", "detail": "", "tags": []}
        print(f"Comment: {_comment['headline']} | {_comment['detail']}")

        output = {
            "latest": {
                "date": latest_idx.strftime('%Y-%m-%d'),
                "fgi": round(float(latest_fgi), 1),
                "derivative": round(float(latest_der), 1),
                "comment": _comment.get("headline", ""),
                "comment_detail": _comment.get("detail", ""),
                "comment_tags": _comment.get("tags", []),
            },
            "chart": {
                "dates": chart_data.index.strftime('%Y-%m-%d').tolist(),
                "fgi": _arr(chart_data, chart_data.index, 1),
                "derivative": _arr(derivative, chart_data.index, 1),
                "hs300": _arr(raw['hs300'], chart_data.index, 2),
                "sh_index": _arr(raw['sh_index'], chart_data.index, 2),
                "volatility_zscore": _arr_z(zscores['volatility_zscore'], chart_data.index),
                "volume_zscore": _arr_z(zscores['volume_zscore'], chart_data.index),
                "futures_premium_zscore": _arr_z(zscores['futures_premium_zscore'], chart_data.index),
                "safe_haven_zscore": _arr_z(zscores['safe_haven_zscore'], chart_data.index),
                "stock_strength_zscore": _arr_z(zscores['stock_strength_zscore'], chart_data.index)
            },
            "update_time": datetime.now().strftime('%Y-%m-%d %H:%M:%S')
        }
        
        with open('data.json', 'w', encoding='utf-8') as f:
            json.dump(output, f, ensure_ascii=False, indent=2)

        # 全历史文件 data_full.json（页面后台加载用；原来停在 2026-04-10 半年没更新）
        full_idx = fgi.dropna()
        full_zs = zscores.reindex(full_idx.index)   # 注意：reindex(Series) 会拿 Series 的值当标签 → 全 NaN，必须传 .index
        def _col_z(name):
            return [round(float(x), 1) if not np.isnan(x) else 50 for x in full_zs[name].tolist()]
        output_full = {
            "latest": output["latest"],
            "chart": {
                "dates": full_idx.index.strftime('%Y-%m-%d').tolist(),
                "fgi": [round(float(x), 1) for x in full_idx.tolist()],
                "derivative": [round(float(x), 1) if not np.isnan(x) else 0 for x in derivative.reindex(full_idx.index).tolist()],
                "hs300": _arr(raw['hs300'], full_idx.index, 2),
                "sh_index": _arr(raw['sh_index'], full_idx.index, 2),
                "volatility_zscore": _col_z('volatility_zscore'),
                "volume_zscore": _col_z('volume_zscore'),
                "futures_premium_zscore": _col_z('futures_premium_zscore'),
                "safe_haven_zscore": _col_z('safe_haven_zscore'),
                "stock_strength_zscore": _col_z('stock_strength_zscore')
            },
            "update_time": output["update_time"]
        }
        with open('data_full.json', 'w', encoding='utf-8') as f:
            json.dump(output_full, f, ensure_ascii=False, indent=2)
        print(f"data_full.json: {len(full_idx)} 行 {full_idx.index[0].strftime('%Y-%m-%d')}~{full_idx.index[-1].strftime('%Y-%m-%d')}")

        # 严格校验：宁可让 CI 红，也不要推送浏览器解析不了的 JSON（NaN/Infinity）
        def _strict_check(fn):
            raw_txt = open(fn, encoding='utf-8').read()
            def _bad(x):
                raise ValueError(f"{fn} 含非法 JSON 常量 {x}")
            json.loads(raw_txt, parse_constant=_bad)
            print(f"{fn}: 严格 JSON 校验通过 ({len(raw_txt)} bytes)")
        _strict_check('data.json')
        _strict_check('data_full.json')

        # 同步刷新 README 顶部的数据徽章（避免像 2026-04 建站时那样半年不更新的死值）
        try:
            import re
            try:  # 历史起始年以 data_full.json 为准（2017 起），取不到就退回 2017
                start_year = json.load(open('data_full.json', encoding='utf-8'))['chart']['dates'][0][:4]
            except Exception:
                start_year = '2017'
            end_year = str(latest_idx.year)
            badge = (
                "<!-- FGI:BADGE:START（由每日任务自动重写，勿手改）-->\n"
                f"![FGI](https://img.shields.io/badge/FGI-{latest_fgi:.1f}-blue)\n"
                f"![数据](https://img.shields.io/badge/数据-{start_year}~{end_year}-green)\n"
                "<!-- FGI:BADGE:END -->"
            )
            with open('README.md', encoding='utf-8') as rf:
                readme = rf.read()
            readme = re.sub(
                r'<!-- FGI:BADGE:START.*?FGI:BADGE:END -->', badge, readme, flags=re.S
            )
            with open('README.md', 'w', encoding='utf-8') as rf:
                rf.write(readme)
            print("README badge updated")
        except Exception as e:
            print(f"[warn] README 徽章更新失败（不影响数据）：{type(e).__name__}: {e}")
        
        print(f"Updated: {latest_idx.strftime('%Y-%m-%d')} FGI={latest_fgi:.1f}")
        print(f"Z-Scores: Vol={latest_zscores['volatility_zscore']:.1f}, VolRatio={latest_zscores['volume_zscore']:.1f}, "
              f"Future={latest_zscores['futures_premium_zscore']:.1f}, SafeHaven={latest_zscores['safe_haven_zscore']:.1f}, "
              f"StockStr={latest_zscores['stock_strength_zscore']:.1f}")
        PYEOF
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json data_full.json README.md
        git diff --staged --quiet || git commit -m "Update data $(date +'%Y-%m-%d')"
        git push
